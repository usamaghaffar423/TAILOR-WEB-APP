<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Man Tailor — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<div id="sidebarMount"></div>

<div class="main">
  <div id="topbarMount"></div>

  <div class="content">
    <div class="hero-row">
      <div>
        <div class="hero-eyebrow">Order Studio</div>
        <div class="hero-title" id="greetingTitle">GOOD MORNING, TOP MAN TAILOR HOUSE</div>
        <div class="hero-date" id="todayDate"></div>
      </div>
      <div class="hero-actions">
        <a class="btn btn-outline" href="customers.html">Add Customer</a>
        <a class="btn btn-primary" href="new-order.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New Order
        </a>
      </div>
    </div>
    <div class="stitch"></div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l7 7M20 4l-7 7M12 11v9M8 20h8"/></svg></div>
        <div class="kpi-label">Total Orders</div>
        <div class="kpi-num" id="kpiTotalOrders">0</div>
        <div class="kpi-sub" id="kpiTotalOrdersSub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
        <div class="kpi-label">In Progress</div>
        <div class="kpi-num" id="kpiInProgress">0</div>
        <div class="kpi-sub" id="kpiInProgressSub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div>
        <div class="kpi-label">Due This Week</div>
        <div class="kpi-num" id="kpiDueWeek">0</div>
        <div class="kpi-sub" id="kpiDueWeekSub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div>
        <div class="kpi-label">Pending Payments</div>
        <div class="kpi-num mono" id="kpiPending">Rs 0</div>
        <div class="kpi-sub" id="kpiPendingSub"></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>Recent Orders</h3><a href="orders.html">View All →</a></div>
        <div class="stitch tight"></div>
        <div id="ordersList"></div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-head"><h3>Karigar Workload</h3><a href="karigars.html">View All →</a></div>
          <div class="stitch tight"></div>
          <div id="karigarList"></div>
        </div>
        <div class="panel panel-spacer">
          <div class="panel-head"><h3>Deadlines This Week</h3></div>
          <div class="stitch tight"></div>
          <div id="deadlineList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/shared.js"></script>
<script>Shared.init('dashboard');</script>
<script src="js/dashboard.js"></script>
</body>
</html>
