<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Man Tailor — Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<div id="sidebarMount"></div>

<div class="main">
  <div id="topbarMount"></div>

  <div class="content">
    <div class="hero-row">
      <div>
        <div class="hero-eyebrow">Order Studio</div>
        <div class="hero-title">PAYMENTS &amp; LEDGER</div>
        <div class="hero-date" id="payCount"></div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" id="btnAddPayment">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add Payment
        </button>
      </div>
    </div>
    <div class="stitch"></div>

    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi-card">
        <div class="kpi-label">Income This Week</div>
        <div class="kpi-num mono" id="incWeek">Rs 0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Income This Month</div>
        <div class="kpi-num mono" id="incMonth">Rs 0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Pending (All Orders)</div>
        <div class="kpi-num mono" id="incPending">Rs 0</div>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="fSearch" placeholder="Search customer or order no...">
      <select id="fMethod">
        <option value="">All Methods</option>
        <option value="cash">Cash</option>
        <option value="easypaisa">Easypaisa</option>
        <option value="jazzcash">JazzCash</option>
        <option value="bank">Bank</option>
      </select>
      <input type="date" id="fFrom" title="From date">
      <input type="date" id="fTo" title="To date">
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Date</th><th>Customer</th><th>Order No.</th><th>Amount</th><th>Method</th><th>Note</th></tr></thead>
          <tbody id="payBody"></tbody>
        </table>
      </div>
      <div id="payEmpty"></div>
    </div>

    <div class="panel panel-spacer">
      <div class="panel-head"><h3>Per-Order Balances</h3></div>
      <div class="stitch tight"></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Order No.</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead>
          <tbody id="balBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Payment Modal -->
<div class="modal-overlay" id="modalAddPayment">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Add Payment</h3>
      <button class="modal-close" data-close-modal="modalAddPayment">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Order</label>
        <input type="text" id="npOrderSearch" placeholder="Search order no. or customer name...">
        <div id="npOrderResults" style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;display:none;"></div>
        <div class="hint" id="npOrderSelected"></div>
      </div>
      <div class="field"><label>Amount</label><input type="number" id="npAmount" placeholder="e.g. 2000" min="0"></div>
      <div class="field">
        <label>Method</label>
        <select id="npMethod">
          <option value="cash">Cash</option>
          <option value="easypaisa">Easypaisa</option>
          <option value="jazzcash">JazzCash</option>
          <option value="bank">Bank</option>
        </select>
      </div>
      <div class="field"><label>Note (optional)</label><input type="text" id="npNote" placeholder="e.g. Advance / Final payment"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-close-modal="modalAddPayment">Cancel</button>
      <button class="btn btn-primary" id="npSave">Save Payment</button>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/shared.js"></script>
<script>Shared.init('payments');</script>
<script src="js/payments.js"></script>
</body>
</html>
