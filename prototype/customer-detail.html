<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Man Tailor — Customer Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<div id="sidebarMount"></div>

<div class="main">
  <div id="topbarMount"></div>

  <div class="content">
    <div class="hero-row">
      <div>
        <div class="hero-eyebrow"><a href="customers.html" style="color:var(--red);text-decoration:none;">Customers</a> / Detail</div>
        <div class="hero-title" id="custName">—</div>
        <div class="hero-date mono" id="custSub"></div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-outline" id="btnWhatsapp">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.6-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.3-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5 0-.1-.6-1.5-.9-2-.2-.5-.5-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.9-1.3.2-.6.2-1.1.2-1.3-.1-.1-.3-.2-.5-.3z"/><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          Share on WhatsApp
        </button>
        <button class="btn btn-outline" id="btnPrint">Print Sheet</button>
        <a class="btn btn-primary" href="new-order.html" id="btnNewOrderFor">New Order</a>
      </div>
    </div>
    <div class="stitch"></div>

    <div class="grid-2">
      <div>
        <div class="panel">
          <div class="panel-head">
            <h3>Contact Info</h3>
            <button class="row-icon-btn no-print" id="btnEditContact" title="Edit contact info">
              <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg>
            </button>
          </div>
          <div class="stitch tight"></div>
          <div class="form-grid cols-2" id="contactInfo" style="margin-top:12px;"></div>
          <div class="hero-actions no-print" id="contactEditActions" style="display:none;justify-content:flex-end;margin-top:14px;">
            <button class="btn btn-outline btn-sm" id="btnCancelContact">Cancel</button>
            <button class="btn btn-primary btn-sm" id="btnSaveContact">Save Changes</button>
          </div>
        </div>

        <div class="panel panel-spacer print-area">
          <div class="print-banner" id="printBanner"></div>
          <div class="panel-head"><h3>Measurements</h3></div>
          <div class="stitch tight"></div>
          <div id="measurementList" class="print-sheet"></div>
        </div>

        <div class="panel panel-spacer">
          <div class="panel-head"><h3>Order History</h3></div>
          <div class="stitch tight"></div>
          <div id="orderHistory"></div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-head"><h3>Summary</h3></div>
          <div class="stitch tight"></div>
          <div style="display:flex;flex-direction:column;gap:14px;margin-top:10px;">
            <div>
              <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Total Spent</div>
              <div class="display" id="sumSpent" style="font-size:28px;">Rs 0</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Pending Balance</div>
              <div class="display" id="sumPending" style="font-size:28px;">Rs 0</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Total Orders</div>
              <div class="display" id="sumOrders" style="font-size:28px;">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/shared.js"></script>
<script>Shared.init('customers');</script>
<script src="js/customer-detail.js"></script>
</body>
</html>
