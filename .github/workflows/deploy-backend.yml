name: Deploy Backend

# Deploys backend/ to Hostinger over SSH whenever backend-relevant files
# change on the default branch. Frontend-only pushes deliberately do not
# trigger this — the API does not need rebuilding for a CSS change.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/scripts/deploy-backend.sh'
      - '.github/workflows/deploy-backend.yml'
  # Manual trigger for the first deploy and any recovery from a bad one.
  workflow_dispatch:
    inputs:
      skip_db_backup:
        description: 'Skip the pre-migration database backup'
        required: false
        type: boolean
        default: false

# Never let two deploys run at once: concurrent composer/migrate runs against
# the same app directory corrupt vendor/ and the migration table.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    # The deploy script is streamed from this repo to the server over SSH.
    # Least privilege: nothing beyond reading the repo is needed.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          # The SSH key is read here only to test whether it is non-empty.
          # It is passed via env, never interpolated into the script body, so
          # it cannot land in the command line or be echoed to the log.
          # Its value is never printed — only set/unset.
          #
          # Connection settings resolve from the Variables tab first and fall
          # back to the Secrets tab (`||` yields the first non-empty), so a
          # setting works no matter which of the two tabs it was added under.
          # The private key deliberately has NO fallback: it must be a secret,
          # because variables are echoed into build output.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=""

          # Written to the run summary because the API strips logs from
          # unauthenticated readers, and a missing variable is exactly the
          # kind of failure an operator needs to read without a token.
          {
            echo "### Deploy configuration"
            echo
            echo "| Setting | Set? | Where to add |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for var in DEPLOY_HOST DEPLOY_PORT DEPLOY_PATH; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
              echo "| \`$var\` | missing | Settings → Secrets and variables → Actions → **Variables** |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$var\` | yes | |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            missing="$missing DEPLOY_SSH_KEY"
            echo "| \`DEPLOY_SSH_KEY\` | missing | Settings → Secrets and variables → Actions → **Secrets** (the private key) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| \`DEPLOY_SSH_KEY\` | yes | |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$missing" ]; then
            echo
            echo "**Not set:** $missing" >> "$GITHUB_STEP_SUMMARY"
            for v in $missing; do
              echo "::error::Repository $v is not set — see the run summary for details."
            done
            exit 1
          fi

          echo
          echo "All settings present. host=$DEPLOY_HOST port=$DEPLOY_PORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
          KNOWN_HOSTS_FINGERPRINT: ${{ vars.KNOWN_HOSTS_FINGERPRINT || secrets.KNOWN_HOSTS_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the host key rather than trusting whatever answers first.
          # KNOWN_HOSTS_FINGERPRINT is a comma-separated allowlist, and every
          # key the server offers must appear in it. A server presenting any
          # additional or substituted key fails the deploy instead of being
          # trusted, so a MITM cannot silently take over the connection.
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/hostkeys 2>/dev/null
          [ -s /tmp/hostkeys ] || { echo "::error::ssh-keyscan returned no keys for $DEPLOY_HOST:$DEPLOY_PORT"; exit 1; }

          if [ -n "$KNOWN_HOSTS_FINGERPRINT" ]; then
            bad=""
            # `ssh-keygen -lf` prints "<bits> <fingerprint> <comment> (<type>)",
            # so the fingerprint is the second field, not the first.
            while read -r _bits fp _rest; do
              [ -n "$fp" ] || continue
              if ! echo ",$KNOWN_HOSTS_FINGERPRINT," | grep -qF ",$fp,"; then
                bad="$bad $fp"
              fi
            done < <(ssh-keygen -lf /tmp/hostkeys)
            if [ -n "$bad" ]; then
              echo "::error::Unrecognised host key(s):$bad"
              echo "::error::If Hostinger rotated its host keys, verify the new fingerprint from hPanel before updating KNOWN_HOSTS_FINGERPRINT."
              exit 1
            fi
            echo "All offered host keys match the pinned fingerprints."
          else
            echo "::warning::KNOWN_HOSTS_FINGERPRINT not set — trusting host key on first contact."
          fi

          cat /tmp/hostkeys >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          SKIP_DB_BACKUP: ${{ inputs.skip_db_backup && '1' || '0' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This step's env lives on the runner, but the script executes on the
          # server: `ssh host 'bash -s'` gives the remote shell a clean
          # environment (SSH does not forward variables, and a shared-hosting
          # account cannot widen AcceptEnv in sshd_config). Forwarding the
          # values as leading export lines on the same stdin stream keeps them
          # inside the encrypted connection — never as a command argument, so
          # they cannot leak into the log or `ps`.
          {
            for name in DEPLOY_PATH DEPLOY_USER SKIP_DB_BACKUP GITHUB_REF_NAME; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat .github/scripts/deploy-backend.sh
          } | ssh -i ~/.ssh/deploy_key \
                  -p "$DEPLOY_PORT" \
                  -o BatchMode=yes \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  "$DEPLOY_USER@$DEPLOY_HOST" \
                  'bash -s'

      - name: Verify API health
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || secrets.HEALTHCHECK_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          url="$HEALTHCHECK_URL"
          if [ -z "$url" ]; then
            echo "::warning::HEALTHCHECK_URL not set, skipping post-deploy check."
            exit 0
          fi

          # Probe from the runner first, but without -f: a blocked request
          # still shows the status code and body instead of just
          # "curl: (22)", which is the difference between a diagnosis and
          # another blind iteration. Two user agents, because WAFs treat
          # curl's default UA differently from a browser's.
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for ua in "curl" "Mozilla/5.0 (compatible; deploy-healthcheck)"; do
            code="$(curl -sS -A "$ua" -o "$tmp" -w '%{http_code}' \
                      --max-time 20 "$url" 2>/dev/null || true)"
            body="$(head -c 300 "$tmp" 2>/dev/null || true)"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"ok"'; then
              echo "API healthy (checked from the runner): $body"
              exit 0
            fi
            echo "runner probe (UA $ua): HTTP ${code:-000} — $body"
          done

          # The runner's datacenter IP is refused by the host's bot protection,
          # which says nothing about the app. Re-check from the server over
          # SSH: same URL, real vhost, PHP-FPM and MySQL. The URL travels on
          # the ssh stdin stream (export line + script), never as an argument.
          echo "runner probe blocked or unhealthy — re-checking from the server"
          {
            printf 'export HEALTHCHECK_URL=%q\n' "$url"
            cat .github/scripts/healthcheck.sh
          } | ssh -i ~/.ssh/deploy_key \
                  -p "$DEPLOY_PORT" \
                  -o BatchMode=yes \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  "$DEPLOY_USER@$DEPLOY_HOST" \
                  'bash -s'
